<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho - Corsair E-commerce</title>
    <link rel="stylesheet" href="style.css"/>
    <link rel="stylesheet" href="carrinho.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-container">
            <a href="index.html" class="logo">
                <img src="imagens/SprintMastersLogo.png" alt="Logo" style="height: 40px;">
            </a>

            <div class="header-actions">
                <a href="login.html" class="icon-btn fa-solid fa-user"></a>
                <a href="carrinho.html" class="icon-btn fa-solid fa-cart-shopping">
                    <span class="cart-count">0</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Cart Container -->
    <div class="cart-container">
        <h1 class="page-title">Meu Carrinho</h1>
        <p class="page-subtitle" id="itemCount">0 itens no carrinho</p>

        <div id="cartContent"></div>
    </div>
</body>
</html>
